<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<title>Village house plan drawing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EEF1F0; --sheet:#FBFCFB; --ink:#18211F; --ink-2:#4B5A57; --rule:#CCD5D2;
  --wall:#28312F; --floor:#FFFFFF; --wet:#DDEBEE; --ver:#E6EAE4;
  --furn:#71817D; --furn-fill:#EEF2F1; --furn-2:#FFFFFF; --dim:#2A5C9A; --chip:#E3ECF7;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --f-bn:"Hind Siliguri","Noto Sans Bengali","Vrinda",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1413; --sheet:#151B1A; --ink:#E4EBE9; --ink-2:#9DAEAA; --rule:#2C3836;
    --wall:#C5D0CD; --floor:#1A2120; --wet:#18282D; --ver:#1F2725;
    --furn:#8FA19C; --furn-fill:#222C2A; --furn-2:#1A2120; --dim:#86B0E8; --chip:#1C2A3B;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1413; --sheet:#151B1A; --ink:#E4EBE9; --ink-2:#9DAEAA; --rule:#2C3836;
  --wall:#C5D0CD; --floor:#1A2120; --wet:#18282D; --ver:#1F2725;
  --furn:#8FA19C; --furn-fill:#222C2A; --furn-2:#1A2120; --dim:#86B0E8; --chip:#1C2A3B;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-body)}
.page{max-width:1180px;margin:0 auto;padding:28px 20px 56px;display:grid;gap:28px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.5vw,2.9rem);line-height:1.05;letter-spacing:.01em}
h2{font-size:1rem;text-transform:uppercase;letter-spacing:.1em;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.eyebrow{font:500 .78rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.lead{max-width:62ch;color:var(--ink-2);margin:12px 0 0}
.bn{font-family:var(--f-bn)}

.titleblock{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:end}
.tb-info{margin:0;display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);background:var(--sheet)}
.tb-info div{padding:9px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tb-info div:nth-child(2n){border-right:0}
.tb-info div:nth-last-child(-n+2){border-bottom:0}
.tb-info dt{font:500 .68rem/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.tb-info dd{margin:3px 0 0;font:500 .98rem/1.3 var(--f-body);font-variant-numeric:tabular-nums}

.sheet{background:var(--sheet);border:1.5px solid var(--ink);display:grid}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);font-size:.92rem}
.controls .lbl{font:500 .7rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.controls label{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.controls input{accent-color:var(--dim);width:16px;height:16px;margin:0}
.controls input:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
.plan-scroll{overflow-x:auto;padding:8px 8px 0}
#plan{display:block;width:100%;min-width:980px;height:auto}
#plan [hidden]{display:none}
#plan .wall{fill:var(--wall)}
#plan .fl,#plan .opening{fill:var(--floor)}
#plan .wet{fill:var(--wet)}
#plan .ver{fill:var(--ver)}
#plan .step{stroke:var(--ink-2);stroke-width:.6}
#plan .stepline{stroke:var(--ink-2);stroke-width:.5}
#plan .win{fill:var(--floor);stroke:var(--ink);stroke-width:.6}
#plan .glass{stroke:var(--ink);stroke-width:.5}
#plan .leaf{stroke:var(--ink);stroke-width:1.4}
#plan .swing{fill:none;stroke:var(--ink-2);stroke-width:.5}
#plan .furn,#plan .counter{fill:var(--furn-fill);stroke:var(--furn);stroke-width:.7}
#plan .furn2,#plan .drain{fill:var(--furn-2);stroke:var(--furn);stroke-width:.7}
#plan .burner,#plan .fline{fill:none;stroke:var(--furn);stroke-width:.55}
#plan .sky{fill:none;stroke:var(--dim);stroke-width:.9;stroke-dasharray:3 2}
#plan .rm{fill:var(--ink);font-family:var(--f-display);font-weight:600;font-size:9.5px;letter-spacing:.06em;text-anchor:middle}
#plan .sz{fill:var(--ink-2);font-family:var(--f-mono);font-size:7.5px;text-anchor:middle}
#plan .tag{fill:var(--dim);font-family:var(--f-mono);font-weight:500;font-size:7px;text-anchor:middle}
#plan .dimline{stroke:var(--dim);stroke-width:.6}
#plan .ext{stroke:var(--dim);stroke-width:.4;opacity:.55}
#plan .tick{stroke:var(--dim);stroke-width:1.1}
#plan .dimt{fill:var(--dim);font-family:var(--f-mono);font-size:7.5px;text-anchor:middle}
#plan .bnl{fill:var(--ink-2);font-family:var(--f-bn);font-weight:500;font-size:8px;letter-spacing:0;text-anchor:middle}
#plan .cmpbn{font-family:var(--f-bn);font-weight:500;font-size:9px;letter-spacing:0}
#plan .cmp{fill:var(--ink-2);font-family:var(--f-display);font-weight:600;font-size:8.5px;letter-spacing:.22em;text-anchor:middle}
#plan .nring{fill:none;stroke:var(--ink);stroke-width:.7}
#plan .narrow{fill:var(--ink)}
#plan .sb1{fill:var(--ink)}
#plan .sb0{fill:var(--sheet);stroke:var(--ink);stroke-width:.6}

.legend{display:flex;flex-wrap:wrap;gap:10px 22px;padding:12px 16px 14px;border-top:1px solid var(--rule);font-size:.86rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend svg{width:30px;height:18px;flex:none}
.legend .k-wall{fill:var(--wall)} .legend .k-fl{fill:var(--floor);stroke:var(--rule)} .legend .k-wet{fill:var(--wet);stroke:var(--rule)}
.legend .k-ink{stroke:var(--ink);fill:none} .legend .k-ink2{stroke:var(--ink-2);fill:none} .legend .k-dim{stroke:var(--dim);fill:none}
.legend .k-furn{fill:var(--furn-fill);stroke:var(--furn)}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}
.stack{display:grid;gap:26px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th{font:500 .68rem/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:10px 10px 6px 0;white-space:nowrap}
td{padding:8px 10px 8px 0;border-top:1px solid var(--rule);vertical-align:top}
td.m{font-family:var(--f-mono);font-size:.84rem;white-space:nowrap}
td.num{text-align:right}
th.num{text-align:right}
.tagchip{display:inline-block;font:500 .78rem/1 var(--f-mono);color:var(--dim);background:var(--chip);padding:4px 6px;border-radius:3px}
td .sub{display:block;color:var(--ink-2);font-size:.84rem;line-height:1.4;margin-top:2px}
td .bn{display:block;color:var(--ink-2);font-size:.86rem;line-height:1.3}
tfoot td{border-top:1.5px solid var(--ink);font-weight:500}

.notes ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.notes li{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:12px;padding-top:12px;border-top:1px solid var(--rule)}
.notes li:first-child{border-top:0;padding-top:0}
.notes li b{font:600 .95rem/1.4 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.notes li p{margin:0;color:var(--ink-2);font-size:.95rem}
.foot{font-size:.86rem;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:14px;max-width:80ch}

.credit{display:grid;gap:2px;padding-top:14px;border-top:1.5px solid var(--ink)}
.credit-lbl{font:500 .7rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.credit-name{font:600 1.2rem/1.3 var(--f-display);letter-spacing:.02em}
.credit-aff{font-size:.92rem;line-height:1.45;color:var(--ink-2)}

@media screen and (max-width:820px){
  .titleblock,.two{grid-template-columns:minmax(0,1fr)}
  .notes li{grid-template-columns:minmax(0,1fr);gap:4px}
}
@page{size:A3;margin:12mm}
@media print{
  body{background:#fff}
  .controls{display:none}
  .page{max-width:none;padding:0}
  .plan-scroll{overflow:visible}
  #plan{min-width:0}
  .sheet,.titleblock,tr,.notes li,.credit{break-inside:avoid}
  .sheet{break-after:page}
}
body{margin:0;background:var(--sheet)}.wrap{width:1600px;padding:26px 30px;box-sizing:border-box}.cap{font:600 30px/1.2 var(--f-display);letter-spacing:.02em}.capsub{font:400 17px/1.4 var(--f-mono);color:var(--ink-2);margin-top:6px}.capbn{font:500 24px/1.1 var(--f-bn);letter-spacing:0;color:var(--ink-2);margin-left:10px}.capbn2{font-family:var(--f-bn);font-size:18px;margin-top:2px}#plan{min-width:0;width:100%}.wrap .credit{margin-top:6px}.wrap .credit-lbl{font-size:13px}.wrap.bnpage .credit-lbl{font-size:17px}.wrap .credit-name{font-size:26px}.wrap .credit-aff{font-size:18px}
.bnpage,.bnpage h1,.bnpage h2,.bnpage .eyebrow,.bnpage .lead,.bnpage .tb-info dt,.bnpage .tb-info dd,.bnpage th,.bnpage td,.bnpage td.m,
.bnpage .notes li b,.bnpage .controls,.bnpage .controls .lbl,.bnpage .legend,.bnpage .foot,.bnpage .cap,.bnpage .capsub{font-family:var(--f-bn)}
.bnpage .eyebrow,.bnpage h2,.bnpage .tb-info dt,.bnpage th,.bnpage .notes li b,.bnpage .controls .lbl{letter-spacing:0;text-transform:none}
.bnpage h1{line-height:1.25}
.bnpage .eyebrow,.bnpage .tb-info dt,.bnpage th,.bnpage .controls .lbl{font-size:.8rem}
.bnpage #plan .rm{font-family:var(--f-bn);font-weight:600;font-size:10px;letter-spacing:0}
.bnpage #plan .sz{font-family:var(--f-bn);font-size:8.5px}
.bnpage #plan .dimt{font-family:var(--f-bn);font-size:9px}
.bnpage #plan .cmpbn{font-size:10px}
.bnpage .credit-lbl{font-family:var(--f-bn);letter-spacing:0;text-transform:none;font-size:.8rem}
.bnpage .credit-name{font-family:var(--f-bn);letter-spacing:0}
</style>
</head>
<body>
<div class="wrap bnpage"><div class="cap">চার রুমের একতলা বাড়ির নকশা</div><div class="capsub">সামনে পশ্চিম দিক · সব মাপ দেয়ালের ভেতরের · বাইরের দেয়াল ১০&quot;, ভেতরের দেয়াল ৫&quot; · বাইরের মাপ ৩৭'-১১&quot; × ৩৫'-৬&quot; + ৪' বারান্দা</div><svg id="plan" viewBox="-100 -96 666 688" role="img" aria-labelledby="plan-title plan-desc" xmlns="http://www.w3.org/2000/svg"><title id="plan-title">নিচতলার নকশা</title><desc id="plan-desc">চার শোবার ঘরের একতলা বাড়ি, পশ্চিমমুখী, ৩৭ ফুট ১১ ইঞ্চি × ৩৫ ফুট ৬ ইঞ্চি, সামনে ৪ ফুট বারান্দা। চার কোণে চারটি শোবার ঘর, পেছনে (পূর্বে) রান্নাঘর ও কমন বাথরুম, উত্তর ও দক্ষিণ পাশে এটাচড বাথ, মাঝখানে স্কাইলাইটসহ ডাইনিং, সামনে (পশ্চিমে) ড্রইং রুম।</desc><g id="g-structure"><rect class="ver" x="0" y="426" width="455" height="48" /><rect class="ver step" x="191.5" y="474" width="72" height="40" /><line class="stepline" x1="191.5" y1="484" x2="263.5" y2="484"/><line class="stepline" x1="191.5" y1="494" x2="263.5" y2="494"/><line class="stepline" x1="191.5" y1="504" x2="263.5" y2="504"/><rect class="wall" x="0" y="464" width="10" height="10" /><rect class="wall" x="151" y="464" width="10" height="10" /><rect class="wall" x="294" y="464" width="10" height="10" /><rect class="wall" x="445" y="464" width="10" height="10" /><rect class="wall" x="0" y="0" width="455" height="426" /><rect class="fl" x="10" y="10" width="144" height="168" /><rect class="wet" x="159" y="10" width="84" height="120" /><rect class="wet" x="248" y="10" width="48" height="84" /><rect class="fl" x="248" y="99" width="48" height="36" /><rect class="fl" x="301" y="10" width="144" height="168" /><rect class="fl" x="99" y="183" width="257" height="60" /><rect class="fl" x="159" y="135" width="137" height="168" /><rect class="wet" x="10" y="183" width="84" height="60" /><rect class="wet" x="361" y="183" width="84" height="60" /><rect class="fl" x="10" y="248" width="144" height="168" /><rect class="fl" x="301" y="248" width="144" height="168" /><rect class="fl" x="159" y="308" widt
